<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DYMRJE47WB"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curate Hamper | Giftastic by Archana</title>
    
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* PREMIUM COLOR PALETTE */
        :root {
            --primary: #9e6462; 
            --primary-dark: #7a4d4c;
            --secondary: #2c3539; 
            --gold: #c5a059; 
            --bg-light: #faf8f5; 
            --bg-white: #ffffff;
            --text-dark: #333333;
            --text-light: #777777;
            --border-color: #eaeaea;
        }
        
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; line-height: 1.6; }
        
        /* SLEEK ANNOUNCEMENT BAR */
        .announcement { background-color: var(--secondary); color: var(--bg-light); text-align: center; padding: 10px; font-size: 0.75em; letter-spacing: 2px; font-weight: 500; text-transform: uppercase; }

        /* MINIMALIST NAVIGATION */
        nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05); position: sticky; top: 0; z-index: 100; transition: all 0.3s ease; }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--secondary); }
        .nav-brand img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #eaeaea; }
        .nav-brand h1 { margin: 0; font-size: 1.3em; font-weight: 700; letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 0.95em; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--primary); }
        .menu-toggle { display: none; font-size: 1.5em; cursor: pointer; color: var(--secondary); }
        .nav-right-controls { display: flex; align-items: center; gap: 15px; }
        
        /* ELEGANT BUTTONS */
        .btn-outline { border: 1px solid var(--secondary); color: var(--secondary); padding: 10px 24px; border-radius: 4px; font-weight: 500; transition: all 0.3s ease; text-decoration: none; font-size: 0.9em; }
        .btn-outline:hover { background: var(--secondary); color: white; }
        .btn-solid { background: var(--primary); color: white !important; padding: 10px 24px; border-radius: 4px; font-weight: 500; transition: all 0.3s ease; text-decoration: none; font-size: 0.9em; border: 1px solid var(--primary); }
        .btn-solid:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
        .mobile-call-btn { display: none; } 

        .page-header { text-align: center; padding: 60px 20px 20px 20px; }
        .page-header h2 { font-size: clamp(2.5em, 5vw, 3.5em); margin: 0; color: var(--secondary); font-weight: 400; letter-spacing: -0.5px; }
        .page-header h2 span { color: var(--primary); }
        .page-header p { font-size: 1.1em; color: var(--text-light); margin-top: 10px; font-weight: 300; }

        .builder-container { max-width: 1000px; margin: 20px auto 80px auto; padding: 0 20px; }
        
        /* EXPERT WIDGET STYLES */
        .concierge-section { background: var(--bg-white); border-radius: 12px; border: 1px solid var(--gold); padding: 40px; margin-bottom: 50px; box-shadow: 0 15px 35px rgba(197, 160, 89, 0.1); position: relative; overflow: hidden; text-align: center; }
        .con-btn { background: var(--bg-white); border: 1px solid #ddd; color: var(--secondary); padding: 12px 25px; border-radius: 4px; font-family: 'Poppins', sans-serif; font-weight: 500; cursor: pointer; transition: all 0.3s ease; font-size: 0.95em; }
        .con-btn:hover { background: var(--secondary); color: white; border-color: var(--secondary); transform: translateY(-2px); }
        @keyframes spinLoader { 100% { transform: rotate(360deg); } }
        
        .divider-text { text-align: center; position: relative; margin: 40px 0; color: var(--text-light); font-weight: 500; letter-spacing: 2px; text-transform: uppercase; font-size: 0.85em; }
        .divider-text::before, .divider-text::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #eaeaea; }
        .divider-text::before { left: 0; }
        .divider-text::after { right: 0; }

        /* BUILDER STYLES */
        .builder-step { background: var(--bg-white); border-radius: 8px; padding: 40px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #eaeaea; }
        .builder-step h3 { margin-top: 0; color: var(--secondary); font-size: 1.5em; display: flex; align-items: center; gap: 15px; font-weight: 500; }
        .builder-step h3 span { background: var(--gold); color: white; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: 700; }

        /* BOX SELECTION GRID */
        .box-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 25px; }
        .box-card { border: 1px solid #eaeaea; border-radius: 8px; padding: 25px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: var(--bg-white); }
        .box-card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.03); }
        .box-card.selected { border-color: var(--primary); background: rgba(158, 100, 98, 0.03); box-shadow: 0 8px 20px rgba(158, 100, 98, 0.1); }
        .box-card h4 { margin: 10px 0 5px 0; color: var(--secondary); font-size: 1.1em; font-weight: 500; }
        .box-card .price { color: var(--primary); font-weight: 600; font-size: 1.1em; }

        /* GOODIES GRID */
        .goodies-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 25px; }
        .goodie-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-white); border: 1px solid #eaeaea; padding: 15px; border-radius: 8px; transition: border-color 0.3s, box-shadow 0.3s; }
        .goodie-item:hover { border-color: var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .goodie-info h5 { margin: 0 0 5px 0; font-size: 0.95em; color: var(--secondary); font-weight: 500; }
        .goodie-info span { font-size: 0.85em; color: var(--text-light); font-weight: 400; }
        .goodie-qty { display: flex; align-items: center; gap: 10px; }
        .goodie-btn { background: transparent; border: 1px solid #ccc; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: 400; color: var(--text-light); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .goodie-btn:hover { background: var(--secondary); color: white; border-color: var(--secondary); }
        .goodie-count { font-weight: 500; font-size: 0.95em; min-width: 15px; text-align: center; color: var(--secondary); }

        /* 👑 SPLIT LAYOUT FOR RESULTS (PREVIEW LEFT | DETAILS RIGHT) */
        .result-split-container { display: flex; flex-direction: row; gap: 40px; align-items: flex-start; justify-content: center; margin-top: 30px; text-align: left; }
        .result-left-preview { flex: 1; max-width: 420px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .result-right-details { flex: 1.2; background: #fafaf9; border-radius: 8px; padding: 25px; border: 1px solid #f0ede9; align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; }

        /* VIRTUAL BOX PREVIEW CONTAINER */
        .virtual-box { 
            background: url('Empty%20Box.jpeg') no-repeat center center; 
            background-size: cover; 
            border-radius: 8px; 
            width: 100%;
            max-width: 550px; 
            aspect-ratio: 1 / 1; 
            padding: 34% 10% 15% 10%; 
            display: flex; 
            flex-wrap: wrap; 
            align-content: flex-start; 
            justify-content: center; 
            gap: 15px; 
            position: relative; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            transition: all 0.3s ease; 
        }

        .empty-state { text-align: center; animation: fadeIn 0.5s ease; background: rgba(255, 255, 255, 0.9); padding: 20px 30px; border-radius: 8px; backdrop-filter: blur(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); margin: auto; }
        
        .virtual-pic-card { width: 85px; height: 85px; background: rgba(255, 255, 255, 0.95); padding: 4px; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); position: relative; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transition: transform 0.3s ease, box-shadow 0.3s ease; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.8); }
        .virtual-pic-card:nth-child(even) { transform: rotate(5deg); }
        .virtual-pic-card:nth-child(odd) { transform: rotate(-5deg); }
        .virtual-pic-card:hover { transform: translateY(-8px) scale(1.15) rotate(0deg); z-index: 10; box-shadow: 0 15px 30px rgba(0,0,0,0.2); border-color: var(--gold); }
        .virtual-pic-img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        
        .virtual-pic-fallback { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; text-align: center; }
        .virtual-pic-fallback span:first-child { font-size: 1.8em; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.05)); }
        .virtual-pic-fallback span:last-child { font-size: 0.55em; font-weight: 500; line-height: 1.2; margin-top: 4px; color: var(--secondary); }
        .virtual-pic-qty { position: absolute; top: -8px; right: -8px; background: var(--primary); color: white; font-size: 0.75em; font-weight: 600; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 3px 8px rgba(0,0,0,0.2); animation: scaleIn 0.3s ease; }

        /* STYLIZED PRODUCT BREAKDOWN ITEMS */
        .info-breakdown-title { font-size: 0.85em; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-light); font-weight: 600; margin-bottom: 15px; border-bottom: 1px solid #ebdcd0; padding-bottom: 5px;}
        .breakdown-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .breakdown-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-white); border: 1px solid #eee; padding: 10px 14px; border-radius: 6px; font-size: 0.9em; }
        .breakdown-item-left { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--secondary); }
        .breakdown-item-qty { background: #f0ede9; font-size: 0.75em; padding: 2px 7px; border-radius: 12px; font-weight: 600; color: var(--primary); }
        .breakdown-item-price { font-weight: 600; color: var(--text-dark); }

        @keyframes popIn { 0% { transform: scale(0.5) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes scaleIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        .note-box { width: 100%; padding: 20px; border: 1px solid #eaeaea; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 0.95em; margin-top: 15px; resize: vertical; min-height: 120px; background: var(--bg-light); color: var(--text-dark); transition: border-color 0.3s; }
        .note-box:focus { outline: none; border-color: var(--gold); background: var(--bg-white); }

        .builder-summary-card { background: var(--secondary); color: white; border-radius: 8px; padding: 40px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1); margin-top: 20px; }
        .summary-total { font-size: 2.2em; font-weight: 400; color: var(--gold); margin: 15px 0 25px 0; letter-spacing: -1px; }
        .add-custom-btn { background: var(--gold); color: white; border: none; padding: 16px 45px; font-size: 1.05em; font-family: 'Poppins', sans-serif; font-weight: 500; border-radius: 4px; cursor: pointer; transition: background 0.3s ease; letter-spacing: 1px; }
        .add-custom-btn:hover { background: #b38f4d; }

        /* FLOATING CART - ELEGANT */
        .floating-cart { position: fixed; bottom: 30px; right: 30px; background: var(--bg-white); color: var(--secondary); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5em; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000; transition: transform 0.3s ease; border: 1px solid #eaeaea; }
        .floating-cart:hover { transform: translateY(-5px); }
        .cart-count { position: absolute; top: -5px; right: -5px; background: var(--primary); color: white; font-size: 0.45em; font-weight: 600; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        /* CART DRAWER */
        .cart-panel { position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh; background: var(--bg-white); box-shadow: -10px 0 30px rgba(0,0,0,0.05); z-index: 2000; transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; }
        .cart-panel.active { right: 0; }
        .cart-header { padding: 25px; background: var(--bg-white); border-bottom: 1px solid #eaeaea; display: flex; justify-content: space-between; align-items: center; }
        .cart-header h3 { margin: 0; font-size: 1.1em; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; }
        .close-cart { font-size: 2em; cursor: pointer; line-height: 1; color: var(--text-light); font-weight: 300; }
        .cart-items { flex-grow: 1; padding: 25px; overflow-y: auto; background: var(--bg-light); }
        .cart-footer { padding: 25px; background: var(--bg-white); border-top: 1px solid #eaeaea; }
        .cart-total { font-size: 1.2em; font-weight: 600; color: var(--secondary); margin-bottom: 20px; display: flex; justify-content: space-between;}
        
        .checkout-btn { width: 100%; background: var(--secondary); color: white; border: none; padding: 16px; font-size: 1em; font-family: 'Poppins', sans-serif; font-weight: 500; border-radius: 4px; cursor: pointer; transition: background 0.3s ease; letter-spacing: 1px; }
        .checkout-btn:hover { background: #1a1f22; }
        
        .cart-item-row { display: flex; align-items: center; gap: 15px; background: var(--bg-white); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eaeaea; }
        .cart-item-img { width: 60px; height: 60px; border-radius: 4px; object-fit: cover; }
        .cart-item-details { flex-grow: 1; }
        .cart-item-title { margin: 0 0 5px 0; font-size: 0.9em; color: var(--secondary); font-weight: 500; line-height: 1.3;}
        .cart-item-price { color: var(--text-light); font-size: 0.85em; }
        .qty-controls { display: flex; align-items: center; gap: 12px; }
        .qty-btn { background: transparent; border: none; cursor: pointer; font-weight: 400; color: var(--text-light); font-size: 1.2em; padding: 0 5px; }
        .qty-btn:hover { color: var(--primary); }

        /* FOOTER */
        .site-footer { background: var(--secondary); color: #e0e0e0; padding: 80px 5% 30px; font-family: 'Poppins', sans-serif; }
        .footer-content { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 50px; max-width: 1200px; margin: 0 auto; }
        .footer-col { flex: 1; min-width: 200px; }
        .footer-col h3 { color: var(--bg-white); font-size: 1em; margin-bottom: 25px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
        .footer-col p { font-size: 0.9em; line-height: 1.8; font-weight: 300; color: #a0a0a0; }
        .footer-links { list-style: none; padding: 0; margin: 0; }
        .footer-links li { margin-bottom: 15px; }
        .footer-links a { color: #a0a0a0; text-decoration: none; transition: color 0.3s ease; font-size: 0.9em; font-weight: 300; }
        .footer-links a:hover { color: var(--bg-white); }
        .social-icons { display: flex; gap: 15px; margin-top: 25px; }
        .social-icons a { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid #4a555c; border-radius: 50%; color: #a0a0a0; text-decoration: none; transition: all 0.3s ease; }
        .social-icons a:hover { background: var(--bg-white); color: var(--secondary); border-color: var(--bg-white); }
        .footer-bottom { text-align: center; padding-top: 40px; margin-top: 60px; border-top: 1px solid #3a444b; color: #777; font-size: 0.85em; font-weight: 300; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .mobile-call-btn { display: inline-block; padding: 8px 16px; font-size: 0.85em; }
            .desktop-call-btn { display: none !important; }
            .nav-links { position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-white); flex-direction: column; padding: 30px 0; gap: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); display: none; }
            .nav-links.active { display: flex; }
            
            /* STACK RESULTS FOR MOBILE */
            .result-split-container { flex-direction: column; align-items: center; gap: 25px; }
            .result-right-details { width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-brand">
            <img src="logo.jpg" alt="Giftastic Logo">
            <h1>Giftastic</h1>
        </a>
        <div class="nav-right-controls">
            <a href="tel:+91829665421
