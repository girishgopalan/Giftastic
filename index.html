<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftastic by Archana | Premium Gifts</title>
    <!-- Importing a beautiful, modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #f1c40f;
            --dark-bg: #111111;
            --text-main: #2d3436;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-main);
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Premium Header */
        header {
            background: linear-gradient(135deg, #4b134f, #c94b4b);
            color: white;
            padding: 50px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border-bottom: 5px solid var(--gold);
        }
        
        /* Logo Styling */
        .logo-img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 4px solid var(--gold);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .logo-img:hover {
            transform: scale(1.05); 
        }

        header p {
            font-size: 1.1em;
            font-weight: 300;
            margin-top: 15px;
            letter-spacing: 1px;
            color: #f8a5c2;
        }
        
        .content {
            flex: 1;
            padding: 60px 20px;
        }
        .content h2 {
            font-size: 2.5em;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2d3436;
        }
        .content p {
            color: #636e72;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        /* Enhanced Video Bezel */
        .video-container {
            width: 320px;
            height: 568px; 
            margin: 0 auto;
            background-color: #000;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 8px solid #ffffff; 
            overflow: hidden;
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .video-container:hover {
            transform: translateY(-10px);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.6);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .btn {
            text-decoration: none;
            color: white;
            padding: 16px 36px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
        }
        .btn-whatsapp {
            background-color: #25D366; 
        }
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
        }
        
        /* Footer */
        .contact-info {
            background-color: var(--dark-bg);
            color: white;
            padding: 70px 20px;
        }
        .contact-info h2 {
            margin-top: 0;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .contact-info h3 {
            color: var(--gold); 
            font-size: 2.8em;
            margin: 20px 0 0 0;
            font-weight: 800;
            text-shadow: 0px 5px 25px rgba(241, 196, 15, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <a href="logo.jpg" target="_blank">
            <img src="logo.jpg" alt="Giftastic by Archana" class="logo-img">
        </a>
        <p>The perfect surprise, every time.</p>
    </header>

    <div class="content">
        <h2>Our Latest Creations</h2>
        <p>Watch our featured promotions below.</p>
        
        <!-- NEW MUSIC PLAYER -->
        <div style="margin: 20px auto 40px auto; max-width: 320px;">
            <p style="color: #e6683c; font-weight: 600; margin-bottom: 10px; font-size: 1.1em;">🎵 Play Our Theme Music</p>
            <audio controls loop style="width: 100%; border-radius: 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.15);">
                <source src="music.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
        
        <div class="video-container">
            <video controls autoplay loop muted playsinline>
                <source src="my-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="action-buttons">
            <a href="https://wa.me/918296654218" target="_blank" class="btn btn-whatsapp">💬 Order on WhatsApp</a>
            <a href="https://www.instagram.com/giftastic101" target="_blank" class="btn btn-instagram">📸 Follow on Instagram</a>
        </div>
    </div>

    <div class="contact-info">
        <h2>Let's Make Something Special</h2>
        <p>Or give us a call directly to start your custom order!</p>
        <h3>📞 +91 8296654218</h3>
    </div>

</body>
</html>
