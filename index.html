<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftastic</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdfbf7;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #e84393;
            color: white;
            padding: 60px 20px;
        }
        h1 {
            margin: 0;
            font-size: 3.5em;
            letter-spacing: 2px;
        }
        .content {
            padding: 40px 20px;
        }
        /* Styling specifically sized for a vertical social media video */
        .video-container {
            width: 300px;
            height: 533px; /* 9:16 Aspect Ratio */
            background-color: #dfe6e9;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            border: 3px dashed #b2bec3;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .contact-info {
            background-color: #2d3436;
            color: white;
            padding: 40px;
            margin-top: 20px;
        }
        .contact-info h3 {
            color: #fdcb6e;
            font-size: 1.8em;
        }
    </style>
</head>
<body>

    <header>
        <!-- This area is perfect for your gift box opening animation -->
        <h1>🎁 Giftastic</h1>
        <p>The perfect surprise, every time.</p>
    </header>

    <div class="content">
        <h2>Our Latest Creations</h2>
        <p>Watch our featured promotions below.</p>
        
        <!-- This box is ready for you to embed your video files later -->
        <div class="video-container">
            <p>[ <div class="video-container">
    <video width="100%" height="100%" controls autoplay loop muted style="border-radius: 12px;">
        <source src="my-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div> ]</p>
        </div>
    </div>

    <div class="contact-info">
        <h2>Let's Make Something Special</h2>
        <p>Call us today to order your customized gift!</p>
        <!-- Update this with your actual business number -->
        <h3>📞 +91 7411958018</h3>
    </div>

</body>
</html>
